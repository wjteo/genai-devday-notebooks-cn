apps:
  - port:
    # Runs MongoDB Atlas Local (mongod+mongot, for Atlas/Vector Search) as a
    # plain docker container and installs requirements.txt into Cloud
    # Studio's own Python environment. Notebooks are opened directly in Cloud
    # Studio's editor (native Jupyter support) rather than a separate
    # JupyterLab tab. See .vscode/cloudstudio-setup.sh.
    run: bash .vscode/cloudstudio-setup.sh
    root: .
    name: MongoDB Atlas Local setup
    autoOpen: false
    autoPreview: false
